{% extends "base.html" %}

{% block title %}Editar producto | Farmacia SaludPlus{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="titulo-modulo">✏️ Editar producto</h2>
        <p class="text-muted mb-0">
            Modificación de información del producto.
        </p>
    </div>
</div>

<div class="card shadow-sm">

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ producto.nombre }}"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Categoría
                    </label>

                    <input
                        type="text"
                        name="categoria"
                        class="form-control"
                        value="{{ producto.categoria }}"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Dosis o presentación
                    </label>

                    <input
                        type="text"
                        name="dosis"
                        class="form-control"
                        value="{{ producto.dosis }}"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Presentación
                    </label>

                    <input
                        type="text"
                        name="presentacion"
                        class="form-control"
                        value="{{ producto.presentacion }}"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Precio
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="precio"
                        class="form-control"
                        value="{{ producto.precio }}"
                        required
                    >
                </div>


                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Stock
                    </label>

                    <input
                        type="number"
                        name="stock"
                        class="form-control"
                        value="{{ producto.stock }}"
                        required
                    >
                </div>

            </div>


            <button
                type="submit"
                class="btn btn-success"
            >
                Guardar cambios
            </button>

            <a
                href="{{ url_for('productos') }}"
                class="btn btn-secondary"
            >
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
