{% extends "base.html" %}

{% block content %}

<h2>Proveedores</h2>

<form method="POST">

    <input
        type="text"
        name="nombre"
        placeholder="Nombre del proveedor"
        required
    >

    <input
        type="text"
        name="telefono"
        placeholder="Teléfono"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Correo electrónico"
        required
    >

    <button type="submit">
        Agregar proveedor
    </button>

</form>

<hr>

<h3>Lista de proveedores</h3>

<table border="1" cellpadding="8">

    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

        {% for proveedor in proveedores %}

        <tr>

            <td>{{ proveedor.id }}</td>
            <td>{{ proveedor.nombre }}</td>
            <td>{{ proveedor.telefono }}</td>
            <td>{{ proveedor.email }}</td>

            <td>

                <a href="{{ url_for('editar_proveedor', id=proveedor.id) }}">
                    Editar
                </a>

                <form
                    method="POST"
                    action="{{ url_for('eliminar_proveedor', id=proveedor.id) }}"
                    style="display:inline;"
                >

                    <button type="submit">
                        Eliminar
                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
